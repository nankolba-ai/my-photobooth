<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - พิพิธภัณฑ์การเกษตร</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Kanit', sans-serif, Tahoma;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1100px;
      width: 100%;
    }

    .preview-box, .result-box {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* กล้องและหน้าจอ Live Preview */
    .camera-container {
      position: relative;
      width: 400px;
      height: 600px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* ส่องกระจก */
    }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 120px;
      font-weight: bold;
      color: #ffeb3b;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      pointer-events: none;
      display: none;
    }

    /* ปุ่มกด */
    .btn {
      background: linear-gradient(135deg, #ffc107, #ff9800);
      color: #000;
      border: none;
      padding: 14px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.98); }

    /* ผลลัพธ์ */
    .strip-preview {
      width: 320px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .qr-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-box {
      width: 180px;
      height: 180px;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <h2>📸 พิพิธภัณฑ์การเกษตร Photo Booth</h2>

  <div class="container">
    <!-- ฝั่งกล้องถ่ายรูป -->
    <div class="preview-box">
      <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="countdown" class="countdown-overlay">3</div>
      </div>
      <button id="snap-btn" class="btn" onclick="startPhotoProcess()">เริ่มถ่ายภาพ (3 รูป)</button>
    </div>

    <!-- ฝั่งแสดงผลงาน & QR Code -->
    <div class="result-box" id="result-box" style="display:none;">
      <h3>ผลลัพธ์รูปถ่าย</h3>
      <img id="final-strip" class="strip-preview" alt="Photo Strip">
      
      <div class="qr-section">
        <p style="font-size: 18px; font-weight: bold;">สแกนเพื่อดาวน์โหลดรูปภาพ</p>
        <div class="qr-box">
          <img id="qr-code" src="" alt="QR Code">
        </div>
        <p style="font-size: 12px; color: #aaa;">รูปภาพจะถูกบันทึกลง Google Drive / Server</p>
        <button class="btn" onclick="resetBooth()">ถ่ายใหม่อีกครั้ง</button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countdownEl = document.getElementById('countdown');
    const finalStrip = document.getElementById('final-strip');
    const qrCode = document.getElementById('qr-code');
    const resultBox = document.getElementById('result-box');
    const snapBtn = document.getElementById('snap-btn');

    let capturedPhotos = [];

    // 1. สร้างระบบเสียงชัตเตอร์กล้องดิจิทัล (แชะ! เสียงดังฟังชัด)
    function playLoudShutterSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // เสียงคลิกชัตเตอร์กลไก (Click/Snap)
      const bufferSize = audioCtx.sampleRate * 0.15; // 0.15 วินาที
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      // Filter เพิ่มความดังและกระแทกของเสียง
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1000;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(2.5, audioCtx.currentTime); // เพิ่มระดับความดัง
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    }

    // เปิดใช้งานกล้อง HD
    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } 
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      alert("ไม่สามารถเปิดกล้องได้: " + err);
    });

    // เริ่มถ่ายภาพ 3 รูปต่อเนื่อง
    async function startPhotoProcess() {
      capturedPhotos = [];
      snapBtn.disabled = true;
      snapBtn.style.opacity = "0.5";

      for (let i = 1; i <= 3; i++) {
        await runCountdown(3);
        playLoudShutterSound();
        capturePhoto();
        await new Promise(r => setTimeout(r, 800));
      }

      await generateFinalStrip();
      snapBtn.disabled = false;
      snapBtn.style.opacity = "1";
    }

    function runCountdown(seconds) {
      return new Promise(resolve => {
        countdownEl.style.display = 'flex';
        let count = seconds;
        countdownEl.innerText = count;

        const interval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(interval);
            countdownEl.style.display = 'none';
            resolve();
          }
        }, 1000);
      });
    }

    function capturePhoto() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth || 1280;
      tempCanvas.height = video.videoHeight || 720;
      const tCtx = tempCanvas.getContext('2d');

      // กลับด้านรูป (Mirror) ให้เหมือนกระจก
      tCtx.translate(tempCanvas.width, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

      capturedPhotos.push(tempCanvas);
    }

    // วาดภาพรวมเข้ากรอบ frame.png และแก้ไขปัญหารูปสั้น/ขอบขาว
    function generateFinalStrip() {
      return new Promise(resolve => {
        const frameImg = new Image();
        frameImg.src = 'frame.png';
        frameImg.crossOrigin = 'Anonymous';

        frameImg.onload = () => {
          // ตั้งขนาด Canvas ให้ตรงกับขนาดพิกเซลจริงของ frame.png (682x1024)
          canvas.width = frameImg.width;
          canvas.height = frameImg.height;

          // พิกัดช่องเจาะรูทั้ง 3 ช่อง (คำนวณครอบคลุมเต็มพื้นที่ ไม่ติดขอบขาว)
          const slots = [
            { x: 120, y: 220, w: 440, h: 225 }, // ช่องที่ 1
            { x: 100, y: 450, w: 460, h: 235 }, // ช่องที่ 2
            { x: 120, y: 700, w: 450, h: 235 }  // ช่องที่ 3 (ขยายพื้นที่ความสูงรองรับเต็มช่อง)
          ];

          // 1. วาดรูปถ่ายลงในช่องเจาะรูแต่ละช่องแบบ COVER (ไม่เกิดขอบขาว)
          capturedPhotos.forEach((photo, idx) => {
            if (idx < 3) {
              const slot = slots[idx];
              drawCoverImage(ctx, photo, slot.x, slot.y, slot.w, slot.h);
            }
          });

          // 2. วาดกรอบ frame.png ทับด้านบนสุด
          ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);

          // แปลงเป็น Data URL เพื่อแสดงผล
          const finalDataUrl = canvas.toDataURL('image/png');
          finalStrip.src = finalDataUrl;
          resultBox.style.display = 'flex';

          // 3. สร้าง QR Code โดยใช้ API ที่เสถียร (api.qrserver.com)
          // สามารถเปลี่ยน URL ด้านล่างเป็นลิงก์ Google Drive หรือระบบฝากรูปของคุณได้
          const downloadUrl = encodeURIComponent(finalDataUrl);
          
          // ใช้ API qrserver ที่รองรับข้อมูลง่ายและไม่บล็อก
          qrCode.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://github.com`;

          resolve();
        };
      });
    }

    // ฟังก์ชั่นคำนวณวาดภาพแบบ Crop Cover ไม่ให้ภาพยืด/หด หรือเหลือขอบขาว
    function drawCoverImage(ctx, img, x, y, targetWidth, targetHeight) {
      const imgWidth = img.width;
      const imgHeight = img.height;
      
      const targetRatio = targetWidth / targetHeight;
      const imgRatio = imgWidth / imgHeight;

      let sw, sh, sx, sy;

      if (imgRatio > targetRatio) {
        sh = imgHeight;
        sw = imgHeight * targetRatio;
        sx = (imgWidth - sw) / 2;
        sy = 0;
      } else {
        sw = imgWidth;
        sh = imgWidth / targetRatio;
        sx = 0;
        sy = (imgHeight - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, targetWidth, targetHeight);
    }

    function resetBooth() {
      resultBox.style.display = 'none';
      capturedPhotos = [];
    }
  </script>
</body>
</html>
