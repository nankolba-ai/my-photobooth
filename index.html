<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - พิพิธภัณฑ์การเกษตร</title>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sukhumvit Set', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
    
    .main-container { display: flex; width: 100%; height: 100%; }
    .camera-section { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: #000; padding: 20px; }
    
    .video-wrapper { position: relative; width: 100%; max-width: 900px; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; max-height: 65vh; border-radius: 16px; transform: scaleX(-1); object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    
    .countdown-overlay {
      position: absolute; font-size: 160px; font-weight: bold; color: #fff;
      text-shadow: 0 0 30px rgba(0,0,0,0.9); display: none; z-index: 10;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    /* แถบพรีวิวภาพถ่ายช็อต 1-2-3 */
    .shots-preview { display: flex; gap: 15px; margin-top: 15px; justify-content: center; }
    .shot-box {
      width: 100px; height: 65px; border: 2px dashed #555; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; color: #888;
      font-weight: bold; font-size: 18px; overflow: hidden; background: #1e1e1e;
      position: relative;
    }
    .shot-box img { width: 100%; height: 100%; object-fit: cover; }
    .shot-box.active { border-color: #4CAF50; color: #4CAF50; }

    .controls { margin-top: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 14px 36px; font-size: 18px; border: none; border-radius: 30px;
      background: #ffca28; color: #000; font-weight: bold; cursor: pointer;
      transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(255,202,40,0.4);
    }
    button:hover { background: #ffd54f; transform: scale(1.05); }
    button:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }
    select { padding: 12px; border-radius: 12px; font-size: 15px; background: #2a2a2a; color: #fff; border: 1px solid #444; }

    /* Modal / Popup */
    .result-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 100; justify-content: center; align-items: center;
    }
    .result-content {
      background: #1e1e1e; padding: 25px 35px; border-radius: 20px; display: flex;
      gap: 35px; align-items: center; max-width: 90%; max-height: 92%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .preview-image { max-height: 80vh; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .qr-container { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
    #qrcode { background: #fff; padding: 15px; border-radius: 16px; min-width: 150px; min-height: 150px; display: flex; align-items: center; justify-content: center; }
    
    .loader {
      border: 4px solid #333; border-top: 4px solid #ffca28; border-radius: 50%;
      width: 45px; height: 45px; animation: spin 1s linear infinite; display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .result-content { flex-direction: column; overflow-y: auto; padding: 20px; }
      .preview-image { max-height: 50vh; }
      video { max-height: 45vh; }
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="camera-section">
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline></video>
      <div id="countdown" class="countdown-overlay">3</div>
    </div>
    
    <!-- พรีวิว 3 ช็อต -->
    <div class="shots-preview">
      <div class="shot-box" id="shot1">1</div>
      <div class="shot-box" id="shot2">2</div>
      <div class="shot-box" id="shot3">3</div>
    </div>

    <div class="controls">
      <select id="cameraSelect"></select>
      
      <!-- ตัวเลือกกรอบภาพ -->
      <select id="frameSelect">
        <option value="agri">กรอบพิพิธภัณฑ์การเกษตร</option>
        <option value="white">กรอบสีขาว มินิมอล</option>
      </select>

      <button id="startBtn" onclick="startPhotoBooth()">📸 เริ่มถ่ายภาพ (START)</button>
    </div>
  </div>
</div>

<!-- Modal สรุปผล & QR Code -->
<div id="resultModal" class="result-modal">
  <div class="result-content">
    <img id="finalPhoto" class="preview-image" src="" alt="Photo Booth Strip">
    <div class="qr-container">
      <h2>สแกนเพื่อดาวน์โหลดรูปภาพ</h2>
      <div id="loader" class="loader"></div>
      <div id="qrcode"></div>
      <p style="color:#aaa; font-size: 14px;">รูปภาพจะถูกบันทึกลง Google Drive</p>
      <button onclick="closeModal()">ถ่ายใหม่อีกครั้ง</button>
    </div>
  </div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
  // 📌 นำ Web App URL ที่ได้จาก Google Apps Script มาใส่ตรงนี้
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx.../exec"; 

  const video = document.getElementById('webcam');
  const cameraSelect = document.getElementById('cameraSelect');
  const frameSelect = document.getElementById('frameSelect');
  const countdownEl = document.getElementById('countdown');
  const resultModal = document.getElementById('resultModal');
  const finalPhoto = document.getElementById('finalPhoto');
  const qrcodeDiv = document.getElementById('qrcode');
  const loader = document.getElementById('loader');

  let photos = [];
  const TOTAL_SHOTS = 3;

  // โหลดกรอบรูปพิพิธภัณฑ์เตรียมไว้
  const customFrameImg = new Image();
  customFrameImg.src = 'frame.png'; // ตั้งชื่อไฟล์รูปกรอบว่า frame.png แล้วอัปโหลดลง GitHub

  // เสียงชัตเตอร์ Synthesizer
  function playShutterSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
  }

  // 1. ดึงรายการกล้อง
  async function getCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(device => device.kind === 'videoinput');
    cameraSelect.innerHTML = '';
    videoDevices.forEach((device, index) => {
      const option = document.createElement('option');
      option.value = device.deviceId;
      option.text = device.label || `กล้อง ${index + 1}`;
      cameraSelect.appendChild(option);
    });
  }

  // 2. เปิดใช้งานกล้อง
  async function startCamera(deviceId) {
    const constraints = {
      video: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
  }

  cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));

  function resetShotsUI() {
    for (let i = 1; i <= TOTAL_SHOTS; i++) {
      const box = document.getElementById(`shot${i}`);
      box.innerHTML = i;
      box.classList.remove('active');
    }
  }

  // 3. เริ่มขั้นตอนนับถอยหลังถ่ายรูป
  async function startPhotoBooth() {
    document.getElementById('startBtn').disabled = true;
    photos = [];
    resetShotsUI();

    for (let i = 0; i < TOTAL_SHOTS; i++) {
      await runCountdown(3);
      playShutterSound();
      takeSnapshot(i);
      await new Promise(r => setTimeout(r, 1000));
    }

    await generatePhotoStrip();
    document.getElementById('startBtn').disabled = false;
  }

  function runCountdown(seconds) {
    return new Promise((resolve) => {
      countdownEl.style.display = 'block';
      let count = seconds;
      countdownEl.innerText = count;

      let timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          resolve();
        }
      }, 1000);
    });
  }

  // 4. บันทึกภาพแบบคงสัดส่วน (ไม่ยืดเบี้ยว)
  function takeSnapshot(shotIndex) {
    const canvas = document.createElement('canvas');
    const targetAspect = 16 / 10; // สัดส่วนช่องกรอบรูป
    
    let srcW = video.videoWidth;
    let srcH = video.videoHeight;
    let cropW = srcW;
    let cropH = srcW / targetAspect;

    if (cropH > srcH) {
      cropH = srcH;
      cropW = srcH * targetAspect;
    }

    const startX = (srcW - cropW) / 2;
    const startY = (srcH - cropH) / 2;

    canvas.width = 800;
    canvas.height = 800 / targetAspect;

    const ctx = canvas.getContext('2d');
    
    // พลิกกระจก
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    
    // Draw แบบ Crop ไม่ให้ภาพยืด
    ctx.drawImage(video, startX, startY, cropW, cropH, 0, 0, canvas.width, canvas.height);

    photos.push(canvas);

    // อัปเดตช่องพรีวิว 1-2-3
    const box = document.getElementById(`shot${shotIndex + 1}`);
    box.innerHTML = `<img src="${canvas.toDataURL()}">`;
    box.classList.add('active');
  }

  // 5. นำภาพมารวมใส่กรอบ
  async function generatePhotoStrip() {
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const selectedFrame = frameSelect.value;

    if (selectedFrame === 'agri') {
      // กรอบภาพพิพิธภัณฑ์การเกษตร
      const frameW = 680;
      const frameH = 1150;
      canvas.width = frameW;
      canvas.height = frameH;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, frameW, frameH);

      // พิกัดช่องสี่เหลี่ยม 3 ช่องตามภาพแนบ
      const slots = [
        { x: 145, y: 220, w: 390, h: 225 },
        { x: 145, y: 468, w: 390, h: 225 },
        { x: 145, y: 715, w: 390, h: 225 }
      ];

      // วาดรูปถ่ายลงในช่อง
      photos.forEach((imgCanvas, i) => {
        if (slots[i]) {
          ctx.drawImage(imgCanvas, slots[i].x, slots[i].y, slots[i].w, slots[i].h);
        }
      });

      // วาดภาพกรอบทับด้านบน (ถ้ามีไฟล์ frame.png)
      if (customFrameImg.complete && customFrameImg.naturalWidth !== 0) {
        ctx.drawImage(customFrameImg, 0, 0, frameW, frameH);
      }

    } else {
      // กรอบมินิมอล สีขาว
      const photoWidth = 600;
      const photoHeight = 380;
      const padding = 30;
      const footerSpace = 90;

      canvas.width = photoWidth + (padding * 2);
      canvas.height = (photoHeight * TOTAL_SHOTS) + (padding * (TOTAL_SHOTS + 1)) + footerSpace;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      photos.forEach((imgCanvas, index) => {
        const yPos = padding + index * (photoHeight + padding);
        ctx.drawImage(imgCanvas, padding, yPos, photoWidth, photoHeight);
      });

      ctx.fillStyle = '#333333';
      ctx.font = '20px Sukhumvit Set, sans-serif';
      ctx.textAlign = 'center';
      const today = new Date().toLocaleDateString('th-TH');
      ctx.fillText(`MEMORIES • ${today}`, canvas.width / 2, canvas.height - 35);
    }

    const dataUrl = canvas.toDataURL('image/png');
    finalPhoto.src = dataUrl;
    
    resultModal.style.display = 'flex';
    uploadToGoogleDrive(dataUrl);
  }

  // 6. อัปโหลดไป Google Drive
  function uploadToGoogleDrive(base64Image) {
    qrcodeDiv.innerHTML = '';
    loader.style.display = 'block';

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ image: base64Image })
    })
    .then(res => res.json())
    .then(data => {
      loader.style.display = 'none';
      if (data.status === 'success') {
        new QRCode(qrcodeDiv, {
          text: data.downloadUrl,
          width: 150,
          height: 150
        });
      } else {
        alert('เกิดข้อผิดพลาดในการบันทึกภาพ');
      }
    })
    .catch(err => {
      loader.style.display = 'none';
      console.error(err);
    });
  }

  function closeModal() {
    resultModal.style.display = 'none';
    resetShotsUI();
  }

  // เริ่มต้นระบบ
  navigator.mediaDevices.getUserMedia({ video: true }).then(() => {
    getCameras().then(() => {
      if (cameraSelect.options.length > 0) {
        startCamera(cameraSelect.value);
      }
    });
  });
</script>

</body>
</html>
