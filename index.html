<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - พิพิธภัณฑ์การเกษตร</title>
  <!-- ดึงคลังสร้าง QR Code และ Font -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header-title {
      font-size: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ฝั่งกล้องถ่ายภาพ */
    .camera-card { width: 420px; }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 560px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* ส่องกระจก */
    }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 130px;
      font-weight: bold;
      color: #f39c12;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: none;
    }

    .btn-snap {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 20px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
    }
    .btn-snap:hover { transform: translateY(-2px); }
    .btn-snap:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ฝั่งแสดงผลลัพธ์ */
    .result-card { width: 380px; display: none; }
    .result-title { font-size: 20px; margin-bottom: 15px; }

    .strip-img {
      width: 260px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .qr-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .qr-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; text-align: center; }

    .qr-box {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-secondary {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-download {
      background: #27ae60;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 25px;
      margin-top: 10px;
      width: 100%;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="header-title">
    <span>📷</span> พิพิธภัณฑ์การเกษตร Photo Booth
  </div>

  <div class="main-container">
    <!-- หน้าจอกล้อง -->
    <div class="card camera-card">
      <div class="video-wrapper">
        <video id="video" autoplay playsinline></video>
        <div id="countdown" class="countdown-overlay">3</div>
      </div>
      <button id="snap-btn" class="btn-snap" onclick="startPhotoProcess()">เริ่มถ่ายภาพ (3 รูป)</button>
    </div>

    <!-- หน้าจอแสดงผลงาน & QR Code -->
    <div class="card result-card" id="result-card">
      <div class="result-title">ผลลัพธ์รูปถ่าย</div>
      <img id="final-strip" class="strip-img" alt="Photo Strip">

      <div class="qr-container">
        <div class="qr-title">สแกนเพื่อเข้าสู่ Google Drive</div>
        <div class="qr-box" id="qrcode-box"></div>
        
        <!-- ลิงก์ดาวน์โหลดตรงลงอุปกรณ์ -->
        <a id="download-btn" class="btn-download" download="photobooth.png">📥 บันทึกรูปภาพลงเครื่อง</a>
        <button class="btn-secondary" onclick="resetBooth()">ถ่ายใหม่อีกครั้ง</button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countdownEl = document.getElementById('countdown');
    const finalStrip = document.getElementById('final-strip');
    const resultCard = document.getElementById('result-card');
    const snapBtn = document.getElementById('snap-btn');
    const downloadBtn = document.getElementById('download-btn');
    const qrcodeBox = document.getElementById('qrcode-box');

    let capturedPhotos = [];

    // ลิงก์โฟลเดอร์ Google Drive สำหรับสร้าง QR Code
    const GOOGLE_DRIVE_FOLDER_URL = "https://drive.google.com/drive/folders/1j0iLmsSVEKsDLiYV621DmuRx2sf72PN8";

    // 1. เสียงชัตเตอร์กล้องดิจิทัล
    function playCameraShutterSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.08));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 800;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(3.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    }

    // เปิดกล้อง HD
    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } 
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      alert("ไม่สามารถเปิดกล้องได้: " + err);
    });

    async function startPhotoProcess() {
      capturedPhotos = [];
      snapBtn.disabled = true;

      for (let i = 1; i <= 3; i++) {
        await runCountdown(3);
        playCameraShutterSound();
        capturePhoto();
        await new Promise(r => setTimeout(r, 600));
      }

      await generateFinalStrip();
      snapBtn.disabled = false;
    }

    function runCountdown(seconds) {
      return new Promise(resolve => {
        countdownEl.style.display = 'flex';
        let count = seconds;
        countdownEl.innerText = count;

        const interval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(interval);
            countdownEl.style.display = 'none';
            resolve();
          }
        }, 1000);
      });
    }

    function capturePhoto() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth || 1280;
      tempCanvas.height = video.videoHeight || 720;
      const tCtx = tempCanvas.getContext('2d');

      // Mirror ภาพ
      tCtx.translate(tempCanvas.width, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

      capturedPhotos.push(tempCanvas);
    }

    // วาดภาพรวมเข้ากับ frame.png อย่างสมบูรณ์แบบ
    function generateFinalStrip() {
      return new Promise(resolve => {
        const frameImg = new Image();
        frameImg.src = 'frame.png';
        frameImg.crossOrigin = 'Anonymous';

        frameImg.onload = () => {
          // ขนาดจริงของกรอบ (682 x 1024)
          canvas.width = frameImg.width;
          canvas.height = frameImg.height;

          // พิกัดช่องภาพที่ 1, 2, 3 (ปรับขอบเขตคลุมพื้นที่จริง)
          const slots = [
            { x: 135, y: 215, w: 398, h: 222 }, // ช่องที่ 1
            { x: 100, y: 446, w: 430, h: 232 }, // ช่องที่ 2
            { x: 132, y: 707, w: 420, h: 222 }  // ช่องที่ 3
          ];

          // 1. วาดรูปถ่ายทั้ง 3 รูปลงบน Canvas ก่อน
          capturedPhotos.forEach((photo, idx) => {
            if (idx < 3) {
              const s = slots[idx];
              drawCoverImage(ctx, photo, s.x, s.y, s.w, s.h);
            }
          });

          // 2. วาดกรอบ frame.png ทับด้านบนรูปถ่าย
          ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);

          // แปลงเป็นรูปภาพ Base64
          const finalDataUrl = canvas.toDataURL('image/png');
          finalStrip.src = finalDataUrl;
          downloadBtn.href = finalDataUrl;
          resultCard.style.display = 'flex';

          // 3. สร้าง QR Code สำหรับเปิดโฟลเดอร์ Google Drive
          qrcodeBox.innerHTML = "";
          new QRCode(qrcodeBox, {
            text: GOOGLE_DRIVE_FOLDER_URL,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });

          resolve();
        };
      });
    }

    // ฟังก์ชันตัดและครอบภาพให้พอดีช่องโดยไม่เสียอัตราส่วน
    function drawCoverImage(ctx, img, x, y, targetWidth, targetHeight) {
      const imgWidth = img.width;
      const imgHeight = img.height;
      
      const targetRatio = targetWidth / targetHeight;
      const imgRatio = imgWidth / imgHeight;

      let sw, sh, sx, sy;

      if (imgRatio > targetRatio) {
        sh = imgHeight;
        sw = imgHeight * targetRatio;
        sx = (imgWidth - sw) / 2;
        sy = 0;
      } else {
        sw = imgWidth;
        sh = imgWidth / targetRatio;
        sx = 0;
        sy = (imgHeight - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, targetWidth, targetHeight);
    }

    function resetBooth() {
      resultCard.style.display = 'none';
      capturedPhotos = [];
    }
  </script>
</body>
</html>
