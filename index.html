<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - พิพิธภัณฑ์การเกษตร</title>
  <!-- ดึงคลังสร้าง QR Code และ Font -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header-title {
      font-size: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ฝั่งกล้องถ่ายภาพ */
    .camera-card { width: 420px; }
    
    .camera-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn-switch {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-switch:hover { background: #444; }

    /* กรอบพรีวิวกล้องซ้อนกรอบจริง */
    .preview-container {
      position: relative;
      width: 320px;
      height: 480px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* สะท้อนภาพสำหรับกล้องหน้า */
    video.mirror {
      transform: scaleX(-1);
    }

    /* Canvas ซ้อนพรีวิวกรอบรูปและรูปที่ถ่ายแล้วสดๆ */
    .overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 130px;
      font-weight: bold;
      color: #f39c12;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      z-index: 10;
      display: none;
    }

    /* ตัวเลือกกรอบรูป */
    .frame-selection {
      width: 100%;
      margin-top: 15px;
    }
    .frame-title {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 8px;
      text-align: center;
    }
    .frame-options {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .frame-option {
      width: 70px;
      height: 100px;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0.6;
      background: #000;
    }
    .frame-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .frame-option.active {
      border-color: #f39c12;
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
    }

    .btn-snap {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 20px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
    }
    .btn-snap:hover { transform: translateY(-2px); }
    .btn-snap:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ฝั่งแสดงผลลัพธ์ */
    .result-card { width: 380px; display: none; }
    .result-title { font-size: 20px; margin-bottom: 15px; }

    .strip-img {
      width: 260px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .qr-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .qr-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; text-align: center; }

    .qr-box {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 160px;
      min-height: 160px;
    }

    .upload-status {
      font-size: 14px;
      color: #f39c12;
      margin-top: 10px;
      text-align: center;
    }

    .btn-secondary {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-download {
      background: #27ae60;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 25px;
      margin-top: 10px;
      width: 100%;
    }

    #output-canvas { display: none; }
  </style>
</head>
<body>

  <div class="header-title">
    <span>📷</span> พิพิธภัณฑ์การเกษตร Photo Booth
  </div>

  <div class="main-container">
    <!-- หน้าจอกล้องถ่ายภาพ -->
    <div class="card camera-card">
      
      <div class="camera-controls">
        <span style="font-size: 14px; color: #aaa;">กล้องถ่ายรูป</span>
        <button id="switch-cam-btn" class="btn-switch" onclick="toggleCamera()">
          🔄 สลับกล้อง (หน้า)
        </button>
      </div>

      <!-- ช่องพรีวิวสดแบบซ้อนกรอบ -->
      <div class="preview-container">
        <video id="video" class="mirror" autoplay playsinline></video>
        <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
        <div id="countdown" class="countdown-overlay">3</div>
      </div>

      <!-- แถบเลือกกรอบรูป -->
      <div class="frame-selection">
        <div class="frame-title">เลือกกรอบรูปที่ต้องการ</div>
        <div class="frame-options">
          <div class="frame-option active" id="opt-frame1" onclick="selectFrame('frame.png', 'opt-frame1')">
            <img src="frame.png" alt="กรอบที่ 1">
          </div>
          <div class="frame-option" id="opt-frame2" onclick="selectFrame('frame2.png', 'opt-frame2')">
            <img src="frame2.png" alt="กรอบที่ 2">
          </div>
        </div>
      </div>

      <button id="snap-btn" class="btn-snap" onclick="startPhotoProcess()">เริ่มถ่ายภาพ (3 รูป)</button>
    </div>

    <!-- หน้าจอแสดงผลงาน & QR Code -->
    <div class="card result-card" id="result-card">
      <div class="result-title">ผลลัพธ์รูปถ่าย</div>
      <img id="final-strip" class="strip-img" alt="Photo Strip">

      <div class="qr-container">
        <div class="qr-title">สแกนเพื่อรับรูปภาพของคุณ</div>
        <div class="qr-box" id="qrcode-box">
          <span style="color:#666; font-size:14px;" id="qr-loading">กำลังสร้าง QR Code...</span>
        </div>
        <div id="upload-status" class="upload-status">กำลังส่งภาพไปยัง Google Drive...</div>
        
        <a id="download-btn" class="btn-download" download="photobooth.png">📥 ดาวน์โหลดลงเครื่อง</a>
        <button class="btn-secondary" onclick="resetBooth()">ถ่ายใหม่อีกครั้ง</button>
      </div>
    </div>
  </div>

  <canvas id="output-canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const outputCanvas = document.getElementById('output-canvas');
    const outputCtx = outputCanvas.getContext('2d');
    
    const countdownEl = document.getElementById('countdown');
    const finalStrip = document.getElementById('final-strip');
    const resultCard = document.getElementById('result-card');
    const snapBtn = document.getElementById('snap-btn');
    const downloadBtn = document.getElementById('download-btn');
    const qrcodeBox = document.getElementById('qrcode-box');
    const uploadStatus = document.getElementById('upload-status');
    const switchCamBtn = document.getElementById('switch-cam-btn');

    let capturedPhotos = [];
    let currentStream = null;
    let currentFacingMode = 'user'; 
    let selectedFrameSrc = 'frame.png'; 
    let loadedFrameImg = new Image();
    let detectedSlots = []; // เก็บพิกัดช่องว่างที่คำนวณได้อัตโนมัติ
    let currentPhotoIndex = 0; // ลำดับรูปที่กำลังถ่าย (0, 1, 2)

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5lhzcxE28syFgbaqW2u3j0Lk776vMzKkaNDT48-5xb6z0k7Bmdfuut5YwWVELwHf4/exec";

    // 1. ระบบกล้อง
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: currentFacingMode
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        if (currentFacingMode === 'user') {
          video.classList.add('mirror');
          switchCamBtn.innerHTML = '🔄 สลับกล้อง (หน้า)';
        } else {
          video.classList.remove('mirror');
          switchCamBtn.innerHTML = '🔄 สลับกล้อง (หลัง)';
        }
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err);
      }
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    // 2. โหลดกรอบและค้นหาช่องว่างโปร่งใสอัตโนมัติ (Auto-Detect Slots)
    function loadAndAnalyzeFrame(src) {
      selectedFrameSrc = src;
      loadedFrameImg = new Image();
      loadedFrameImg.crossOrigin = 'Anonymous';
      loadedFrameImg.src = src;

      loadedFrameImg.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = loadedFrameImg.width;
        tempCanvas.height = loadedFrameImg.height;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(loadedFrameImg, 0, 0);

        const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;

        // ตรวจหาพิกัดพื้นที่ที่มี Alpha < 100 (ช่องโปร่งใส)
        let alphaGrid = [];
        for (let y = 0; y < tempCanvas.height; y++) {
          alphaGrid[y] = [];
          for (let x = 0; x < tempCanvas.width; x++) {
            let a = data[(y * tempCanvas.width + x) * 4 + 3];
            alphaGrid[y][x] = a < 100 ? 1 : 0;
          }
        }

        // ค้นหารอบขอบช่องสี่เหลี่ยมโปร่งใส 3 ช่อง
        detectedSlots = findFrameSlots(alphaGrid, tempCanvas.width, tempCanvas.height);
        
        // ตั้งค่าขนาด Canvas พรีวิวให้ตรงกับอัตราส่วนกรอบ
        overlayCanvas.width = loadedFrameImg.width;
        overlayCanvas.height = loadedFrameImg.height;

        renderLiveOverlay();
      };
    }

    // ฟังก์ชันคำนวณหากรอบสี่เหลี่ยม 3 ช่องจากไฟล์ PNG
    function findFrameSlots(grid, width, height) {
      let slots = [];
      let visited = Array.from({ length: height }, () => new Uint8Array(width));

      for (let y = 0; y < height; y += 5) {
        for (let x = 0; x < width; x += 5) {
          if (grid[y][x] === 1 && !visited[y][x]) {
            // หาขอบเขต Bounding Box
            let minX = x, maxX = x, minY = y, maxY = y;
            let queue = [[x, y]];
            visited[y][x] = 1;

            let count = 0;
            while(queue.length > 0) {
              let [cx, cy] = queue.pop();
              count++;
              if (cx < minX) minX = cx;
              if (cx > maxX) maxX = cx;
              if (cy < minY) minY = cy;
              if (cy > maxY) maxY = cy;

              let neighbors = [[cx+10, cy], [cx-10, cy], [cx, cy+10], [cx, cy-10]];
              for (let [nx, ny] of neighbors) {
                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                  if (grid[ny][nx] === 1 && !visited[ny][nx]) {
                    visited[ny][nx] = 1;
                    queue.push([nx, ny]);
                  }
                }
              }
            }

            let w = maxX - minX;
            let h = maxY - minY;
            if (w > width * 0.3 && h > height * 0.1) {
              slots.push({ x: minX, y: minY, w: w, h: h });
            }
          }
        }
      }

      slots.sort((a, b) => a.y - b.y);
      return slots.slice(0, 3);
    }

    // 3. วาดภาพซ้อน Real-time บนหน้าจอกล้อง (พรีวิวเห็นรูป 1-2 ก่อนหน้า + กรอบ)
    function renderLiveOverlay() {
      requestAnimationFrame(renderLiveOverlay);

      if (!loadedFrameImg.complete || detectedSlots.length < 3) return;

      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // วาดรูปถ่ายก่อนหน้าที่ถ่ายเสร็จแล้วลงในช่อง
      capturedPhotos.forEach((photoCanvas, idx) => {
        if (idx < detectedSlots.length) {
          const s = detectedSlots[idx];
          drawCoverImage(overlayCtx, photoCanvas, s.x, s.y, s.w, s.h);
        }
      });

      // วาดไฮไลท์กล่องสีทองบอกช่องที่กำลังจะถ่ายในปัจจุบัน
      if (currentPhotoIndex < detectedSlots.length) {
        const activeSlot = detectedSlots[currentPhotoIndex];
        overlayCtx.strokeStyle = '#f39c12';
        overlayCtx.lineWidth = 6;
        overlayCtx.strokeRect(activeSlot.x, activeSlot.y, activeSlot.w, activeSlot.h);
      }

      // วาดกรอบรูปทับลงด้านบน
      overlayCtx.drawImage(loadedFrameImg, 0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    function selectFrame(frameSrc, elementId) {
      document.querySelectorAll('.frame-option').forEach(el => el.classList.remove('active'));
      document.getElementById(elementId).classList.add('active');
      loadAndAnalyzeFrame(frameSrc);
    }

    // 4. เสียงชัตเตอร์
    function playCameraShutterSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.08));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 800;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(3.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    }

    // 5. กระบวนการถ่ายภาพ 3 รูป
    async function startPhotoProcess() {
      capturedPhotos = [];
      currentPhotoIndex = 0;
      snapBtn.disabled = true;

      for (let i = 0; i < 3; i++) {
        currentPhotoIndex = i;
        await runCountdown(3);
        playCameraShutterSound();
        capturePhoto();
        await new Promise(r => setTimeout(r, 600));
      }

      await generateFinalStrip();
      snapBtn.disabled = false;
    }

    function runCountdown(seconds) {
      return new Promise(resolve => {
        countdownEl.style.display = 'flex';
        let count = seconds;
        countdownEl.innerText = count;

        const interval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(interval);
            countdownEl.style.display = 'none';
            resolve();
          }
        }, 1000);
      });
    }

    function capturePhoto() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth || 1280;
      tempCanvas.height = video.videoHeight || 720;
      const tCtx = tempCanvas.getContext('2d');

      if (currentFacingMode === 'user') {
        tCtx.translate(tempCanvas.width, 0);
        tCtx.scale(-1, 1);
      }
      
      tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      capturedPhotos.push(tempCanvas);
    }

    // 6. รวมภาพถ่ายทั้งหมดเข้ากับกรอบรูป
    function generateFinalStrip() {
      return new Promise(resolve => {
        outputCanvas.width = loadedFrameImg.width;
        outputCanvas.height = loadedFrameImg.height;

        // วาดภาพทั้ง 3 รูปลงในช่อง
        capturedPhotos.forEach((photo, idx) => {
          if (idx < detectedSlots.length) {
            const s = detectedSlots[idx];
            drawCoverImage(outputCtx, photo, s.x, s.y, s.w, s.h);
          }
        });

        // วาดกรอบรูปปิดทับ
        outputCtx.drawImage(loadedFrameImg, 0, 0, outputCanvas.width, outputCanvas.height);

        const finalDataUrl = outputCanvas.toDataURL('image/png');
        finalStrip.src = finalDataUrl;
        downloadBtn.href = finalDataUrl;
        resultCard.style.display = 'flex';

        uploadToGoogleDrive(finalDataUrl);
        resolve();
      });
    }

    // 7. อัปโหลดลง Google Drive & สร้าง QR Code
    async function uploadToGoogleDrive(base64Image) {
      qrcodeBox.innerHTML = '<span style="color:#666; font-size:14px;">กำลังสร้าง QR Code...</span>';
      uploadStatus.innerText = "กำลังส่งภาพไปยัง Google Drive...";
      uploadStatus.style.color = "#f39c12";

      try {
        const base64Data = base64Image.replace(/^data:image\/(png|jpeg);base64,/, "");
        
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            image: base64Data,
            filename: "photobooth_" + Date.now() + ".png"
          })
        });

        const result = await response.json();

        if (result.status === "success" && result.url) {
          const singleFileUrl = result.url;
          
          uploadStatus.innerText = "อัปโหลดสำเร็จ! สแกนเพื่อดาวน์โหลดรูปของคุณ";
          uploadStatus.style.color = "#27ae60";

          qrcodeBox.innerHTML = "";
          new QRCode(qrcodeBox, {
            text: singleFileUrl,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });
        } else {
          throw new Error(result.message || "Upload Failed");
        }
      } catch (error) {
        console.error(error);
        uploadStatus.innerText = "อัปโหลดไม่สำเร็จ (บันทึกรูปผ่านปุ่มด้านล่างแทนได้)";
        uploadStatus.style.color = "#e74c3c";
        qrcodeBox.innerHTML = '<span style="color:#999; font-size:12px;">ไม่สามารถแสดง QR Code ได้</span>';
      }
    }

    // ครอบตัดรูปภาพให้เข้าช่องพอดี ไม่เสียอัตราส่วน
    function drawCoverImage(ctx, img, x, y, targetWidth, targetHeight) {
      const imgWidth = img.width;
      const imgHeight = img.height;
      
      const targetRatio = targetWidth / targetHeight;
      const imgRatio = imgWidth / imgHeight;

      let sw, sh, sx, sy;

      if (imgRatio > targetRatio) {
        sh = imgHeight;
        sw = imgHeight * targetRatio;
        sx = (imgWidth - sw) / 2;
        sy = 0;
      } else {
        sw = imgWidth;
        sh = imgWidth / targetRatio;
        sx = 0;
        sy = (imgHeight - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, targetWidth, targetHeight);
    }

    function resetBooth() {
      resultCard.style.display = 'none';
      capturedPhotos = [];
      currentPhotoIndex = 0;
    }

    // เริ่มต้นระบบ
    startCamera();
    loadAndAnalyzeFrame(selectedFrameSrc);
  </script>
</body>
</html>
